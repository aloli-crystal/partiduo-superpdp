en:
  superpdp_ui:
    title: "SUPER PDP approved platform"
    note: "Credentials, secrets and tokens are encrypted in the database and never shown again. Once connected, SUPER PDP becomes the approved platform for e-invoicing: transmissions, receptions and statuses are followed in the e-invoicing screens."
    status:
      title: "Connection status"
      connected: "SUPER PDP is connected."
      none: "SUPER PDP is not connected: choose one of the two modes below."
      other_adapter: "Another platform (%{adapter}) is currently connected; connecting SUPER PDP will replace it."
      mode: "Mode"
      mode_unconfirmed: "(to be confirmed by a check)"
      sandbox_note: "Sandbox: exchanged invoices are fictitious and never reach the tax administration."
      auth_mode: "Authentication"
      company: "Company"
      verification: "Verification"
      connected_at: "Connected on"
      checked_at: "Last check"
      last_sync: "Last synchronisation"
      never_synced: "Never synchronised"
      disconnect_note: "Disconnecting revokes the tokens at SUPER PDP; nothing is sent or received any more."
    directory:
      title: "Receiving addresses (directory)"
      address: "Address"
      kind: "Format"
      directory: "Directory"
      status: "State"
      reply_to: "reply address"
      none: "No directory line: the company does not receive invoices through SUPER PDP yet."
    vat:
      title: "VAT regime (e-reporting)"
      regime: "VAT regime declared to SUPER PDP"
      unset: "Not set"
      on_debits: "Option for VAT on debits"
      help: "The e-reporting schedule depends on it; SUPER PDP refuses e-reporting data until it is set."
    connect:
      title: "Connect"
      change: "Change the connection"
      current: "Current mode"
      cc_help: "Create an application in your SUPER PDP account (Applications menu) and copy its identifier and secret here. The sandbox or production mode is the one of the application's company."
      client_id: "Client identifier (client_id)"
      client_secret: "Client secret (client_secret)"
      secret_stored: "Stored — leave empty to keep it"
      ac_help: "You will be redirected to SUPER PDP to create or open your account, have your identity and company verified, then authorise Partiduo; you will then come back here."
      ac_unavailable: "This mode needs a SUPER PDP OAuth application declared by the operator of this instance (PARTIDUO_SUPERPDP_OAUTH_CLIENT_ID and PARTIDUO_SUPERPDP_OAUTH_CLIENT_SECRET); it is not configured."
      login_hint: "Email address of the SUPER PDP account"
      company_number: "Company number"
      scheme: "Number type"
    actions:
      connect: "Check and connect"
      authorize: "Connect with SUPER PDP"
      check: "Check the connection"
      disconnect: "Disconnect"
    flash:
      connected: "SUPER PDP is connected (%{mode})."
      checked: "SUPER PDP answers (%{mode})."
      vat_regime: "VAT regime saved at SUPER PDP."
      disconnected: "SUPER PDP is disconnected; the tokens are revoked."
